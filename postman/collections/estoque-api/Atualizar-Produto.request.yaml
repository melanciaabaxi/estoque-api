$kind: http-request
name: Atualizar Produto
order: 3000
method: PUT
url: '{{base_url}}/produtos/{{id}}'
pathVariables:
  - key: id
    value: '1'
    description: ID do produto a ser atualizado
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nome": "Produto Atualizado",
      "quantidade": 20,
      "preco": 49.99
    }
